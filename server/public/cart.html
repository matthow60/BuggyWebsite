<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cart · Mavs Merch</title>
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <header id="site-header"></header>
  <main>
    <h1>Your cart</h1>
    <p class="subtitle">Free shipping on orders over $50.</p>
    <div class="two-col">
      <section class="panel" id="items"><div class="skeleton" style="height:180px"></div></section>
      <aside class="panel">
        <h2>Order summary</h2>
        <form class="field" id="promo-form" autocomplete="off">
          <label for="promo">Promo code</label>
          <div class="inline">
            <input class="input" id="promo" placeholder="e.g. MAVS10" />
            <button class="btn secondary" type="submit">Apply</button>
          </div>
          <div id="promo-applied"></div>
        </form>
        <div class="divider"></div>
        <div id="summary"></div>
        <a class="btn block" href="/checkout" style="display:block;text-align:center;text-decoration:none;margin-top:16px">Continue to checkout</a>
      </aside>
    </div>
  </main>
  <footer class="site-footer">Mavs Merch Store · HackUTA demo app · Not an official UTA store</footer>
  <script src="/assets/common.js"></script>
  <script src="/assets/cart.js"></script>
</body>
</html>
