<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Checkout · Mavs Merch</title>
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <header id="site-header"></header>
  <main id="main">
    <h1>Checkout</h1>
    <p class="subtitle">Almost there, Mav. Split the bill with friends if you like.</p>
    <div class="two-col">
      <section class="panel">
        <h2>Your details</h2>
        <div class="field">
          <label for="name">Name</label>
          <input class="input" id="name" placeholder="Maverick Student" autocomplete="name" />
        </div>
        <div class="field">
          <label for="email">UTA email</label>
          <input class="input" id="email" type="email" placeholder="you@mavs.uta.edu" autocomplete="email" />
        </div>
        <div class="divider"></div>
        <h2>Split payment with friends</h2>
        <div class="field">
          <label for="payers">Friends splitting with you</label>
          <div class="inline">
            <input class="input" id="payers" placeholder="e.g. Alex, Jordan, Sam" autocomplete="off" />
            <button class="btn secondary" type="button" id="split-btn">Calculate split</button>
          </div>
          <span class="hint">Separate names with commas. You cover any leftover cents.</span>
          <div class="split-result" id="split-result"></div>
        </div>
      </section>
      <aside class="panel">
        <h2>Order summary</h2>
        <div id="summary"><div class="skeleton" style="height:140px"></div></div>
        <button class="btn block" type="button" id="place-btn" style="margin-top:16px">Place order</button>
      </aside>
    </div>
  </main>
  <footer class="site-footer">Mavs Merch Store · HackUTA demo app · Not an official UTA store</footer>
  <script src="/assets/common.js"></script>
  <script src="/assets/checkout.js"></script>
</body>
</html>
